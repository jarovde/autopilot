name: Auto Publish Article

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate and publish article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python run.py

      - name: Commit updated state
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: mark topic published [skip ci]"
          git push

      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 -c "
import urllib.request, urllib.parse, os, json
token = os.environ['TG_TOKEN']
chat_id = os.environ['TG_CHAT_ID']
msg = 'Autopilot: new article published on dev.to/syncore'
data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg}).encode()
urllib.request.urlopen(f'https://api.telegram.org/bot{token}/sendMessage', data)
print('Telegram notified')
"

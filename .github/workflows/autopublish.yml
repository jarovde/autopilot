name: Auto Publish Article

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen genereren en tonen, niets publiceren"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate and publish article
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated state
        # Een dry run vinkt geen topic af, dus er valt ook niets vast te leggen.
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: mark topic published [skip ci]"
          git push

      # Alles onder `run: |` MOET dieper inspringen dan de `run:` sleutel.
      # Stond dit script op kolom 0, dan stopt het block-scalar daar en leest
      # YAML `import urllib.request...` als een top-level key → parse error.
      # Dat is precies wat hier 8 weken lang misging: een onparseerbare
      # workflow registreert zijn `schedule` niet, dus de maandag-cron bestond
      # simpelweg niet. Laat de inspringing staan.
      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ARTICLE_URL: ${{ steps.publish.outputs.url }}
          JOB_STATUS: ${{ job.status }}
          REDEN: ${{ steps.publish.outputs.reden }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TG_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          if not token or not chat_id:
              print("no telegram secrets — skipped")
              raise SystemExit(0)
          if os.environ["JOB_STATUS"] == "success" and os.environ.get("DRY_RUN") == "true":
              # Een dry run publiceert niets; melden dat er een artikel live is
              # zou een leugen zijn met dezelfde vorm als de echte melding.
              msg = f"Autopilot dry run geslaagd — niets gepubliceerd\n{os.environ['RUN_URL']}"
          elif os.environ["JOB_STATUS"] == "success":
              url = os.environ.get("ARTICLE_URL") or "dev.to/syncore"
              msg = f"Autopilot: nieuw artikel live\n{url}"
          else:
              # Stilte was het echte probleem — een mislukte run meldt zichzelf.
              # De reden erbij: de Actions-logs zijn afgeschermd, dus zonder
              # dit is "FAALDE" alles wat je hebt en sta je te gissen.
              reden = os.environ.get("REDEN") or "geen reden doorgegeven"
              msg = (f"Autopilot FAALDE ({os.environ['JOB_STATUS']})\n"
                     f"{reden}\n{os.environ['RUN_URL']}")
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage", data, timeout=20)
          print("Telegram notified")
          PY

name: Diagnose (tijdelijk)

# TIJDELIJKE workflow op de branch 'diagnose'. Bestaat omdat run #12 faalde met
# alleen "exit code 1" en de Actions-logs authenticatie vragen — van buitenaf
# was dus niet vast te stellen wat er misging. Deze draait de pijplijn met de
# ECHTE Gemini-sleutel in dry-run (publiceert niets, vinkt geen topic af) en
# schrijft de volledige uitvoer terug naar diagnose-output.txt, zodat de
# uitkomst leesbaar is zonder toegang tot de logs.
#
# Verwijderen zodra de oorzaak bekend is.

on:
  push:
    branches: [diagnose]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests

      - name: Draai de pijplijn in dry-run en vang alles op
        id: draai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python run.py --dry-run > uitvoer.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Schrijf de uitkomst terug naar de repo
        if: always()
        run: |
          {
            echo "# diagnose $(date -u +%FT%TZ)"
            echo "# exitcode: ${{ steps.draai.outputs.exitcode }}"
            echo "# secret aanwezig: ${{ secrets.GEMINI_API_KEY != '' }}"
            echo "-----"
            head -c 6000 uitvoer.txt
          } > diagnose-output.txt
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add diagnose-output.txt
          git diff --cached --quiet || git commit -m "diagnose: uitkomst [skip ci]"
          git push origin diagnose
